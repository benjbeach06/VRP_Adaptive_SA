name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unit tests (exhaustive matrices)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 3.14 is a hard requirement, not a preference: the model uses PEP 695 generics
      # (class Foo[T], type X = ...) which need 3.12+, and relies on PEP 649 deferred annotation
      # evaluation for the forward references throughout the core model, which needs 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      # VRP_FULL_MATRIX=1 runs the exhaustive operand sweeps, a superset of the reduced set the
      # suite runs by default for local speed. Roughly 20s -- worth doing on every push, since
      # these are the checks that catch operator-contract violations at their source.
      - name: Run test suite
        env:
          VRP_FULL_MATRIX: "1"
        run: python -m unittest discover -s tests -v

  typecheck:
    name: pyright (informational)
    runs-on: ubuntu-latest
    # Non-blocking on purpose: the codebase still carries known type findings that are tracked
    # rather than fixed, so failing the build on them would just train people to ignore CI.
    # The value is the diff -- a NEW finding in a pull request is the thing worth looking at.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pyright

      # Settings come from pyrightconfig.json at the repo root. pythonVersion matters most:
      # without it pyright assumes eager annotation evaluation and reports ~76 spurious
      # forward-reference errors that PEP 649 makes impossible on 3.14.
      - name: Run pyright
        run: pyright
